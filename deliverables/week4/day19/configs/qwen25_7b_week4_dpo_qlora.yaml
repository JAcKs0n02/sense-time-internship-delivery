# Day19 formal DPO/QLoRA configuration for LLaMA-Factory v0.9.3.
# Policy and explicit reference both start from the frozen Week3 best merged SFT model.

### model
model_name_or_path: /root/autodl-tmp/qwen25-week3/best_model/qwen25-7b-week3-best-merged
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
upcast_layernorm: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid
ref_model: /root/autodl-tmp/qwen25-week3/best_model/qwen25-7b-week3-best-merged
ref_model_quantization_bit: 4

### dataset
dataset: week4_dpo_train
eval_dataset: week4_dpo_validation
dataset_dir: /root/autodl-tmp/qwen25-week4/day19/data
template: qwen
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /root/autodl-tmp/qwen25-week4/day19/runs/formal-placeholder
run_name: qwen25-7b-week4-day19-dpo
logging_steps: 1
save_steps: 80
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
gradient_checkpointing: true
learning_rate: 5.0e-6
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null

### eval
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 40
