# Day 11 smoke-only configuration. This run is excluded from the formal matrix.

### model
model_name_or_path: /root/autodl-tmp/qwen25-week1/week1/models/Qwen2.5-7B-Instruct
trust_remote_code: true
quantization_bit: 4
quantization_method: bnb
quantization_type: nf4
double_quantization: true
upcast_layernorm: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: week2_clean_alpaca
dataset_dir: /root/autodl-tmp/qwen25-week3/data
template: qwen
cutoff_len: 2048
max_samples: 8
overwrite_cache: true
preprocessing_num_workers: 4
dataloader_num_workers: 2

### output
output_dir: /root/autodl-tmp/qwen25-week3/smoke/day11-qlora-smoke
run_name: qwen25-7b-week3-day11-smoke
logging_steps: 1
save_steps: 1000
save_total_limit: 2
plot_loss: true
overwrite_output_dir: false
save_only_model: false
report_to: tensorboard

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4
gradient_checkpointing: true
learning_rate: 1.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
max_grad_norm: 1.0
bf16: true
fp16: false
seed: 42
ddp_timeout: 180000000
resume_from_checkpoint: null
